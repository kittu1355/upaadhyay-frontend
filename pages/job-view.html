<body class="sp"><div id="siteNav"></div>
<main id="main"></main><div id="siteChrome"></div>
<script src="../js/api.js"></script>
<script src="../js/live-update.js?v=1"></script>
<script src="../js/store.js"></script><script src="../js/employer.js"></script><script src="../js/auth.js"></script><script src="../js/faculty.js"></script><script src="../js/layout.js"></script><script src="../js/backend.js"></script><script src="../js/site-pages.js"></script>
<script>spBoot('jobs');
var q=new URLSearchParams(location.search),m=document.getElementById('main'),cat=q.get('c')||(location.pathname.split('/jobs/')[1]||'').replace(/\/$/,''),id=q.get('id');
if(!id&&/^\d+$/.test(cat)){id=cat;cat=''}
function list(){var all=cat==='all'||!SP_CATS[cat],t=all?['All Jobs','Explore verified faculty opportunities from institutions across India.']:SP_CATS[cat];document.title=t[0]+' Jobs — Upaadhyay';
 m.innerHTML='<header class="sp-hero sm"><div class="wrap"><h1>'+t[0]+(all?'':' Jobs')+'</h1><p>'+(all?t[1]:'Explore verified '+t[0]+' opportunities from institutions across India. '+t[1])+'</p></div></header><section class="sp-sec"><div class="wrap"><div class="sp-filters"><input id="s" placeholder="Search title or institution" oninput="draw()"><select id="l" onchange="draw()"><option value="">Location</option>'+SP_CITY.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><select id="x" onchange="draw()"><option value="">Experience</option><option value="3">3+ yrs</option><option value="6">6+ yrs</option></select><select id="u" onchange="draw()"><option value="">Subject</option>'+['Computer Science','Physics','Commerce','Chemistry','Mathematics','Biotechnology'].map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><select id="i" onchange="draw()"><option value="">Institution</option>'+SP_INST.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><select id="y" onchange="draw()"><option value="">Job type</option><option>Full-time</option><option>Contract</option></select></div><p class="sp-sub" id="n"></p><div class="sp-jobs" id="g"></div></div></section>';draw()}
function draw(){var g=function(k){return document.getElementById(k).value},s=g('s').toLowerCase();var r=SP_JOBS.filter(function(j){return(cat==='all'||!SP_CATS[cat]||j.cat===cat)&&(!s||(j.title+j.inst).toLowerCase().indexOf(s)>-1)&&(!g('l')||j.loc===g('l'))&&(!g('x')||j.exp>=+g('x'))&&(!g('u')||j.subj===g('u'))&&(!g('i')||j.inst===g('i'))&&(!g('y')||j.type===g('y'))});document.getElementById('n').textContent=r.length+' jobs';document.getElementById('g').innerHTML=r.map(spJobCard).join('')||'<p>No jobs match these filters.</p>'}
function detail(){
 var j=SP_JOBS.filter(function(x){return x.id==id})[0];if(!j){cat='all';return list()}
 document.title=j.title+' — Upaadhyay';
 var r=j.raw||{},sk=(r.skills&&r.skills.length?r.skills:[]),sid=String(j.id).replace(/'/g,''),
  tl=String(j.type||'').toLowerCase(),pc=tl.indexOf('part')>-1||tl.indexOf('visit')>-1?'part':tl.indexOf('contract')>-1?'con':'',
  saved=jbIsSaved(sid),applied=jbIsApplied(sid),
  exp=jbExpText({minExp:Number(j.exp)||0,raw:r.raw||{}}),
  vac=(r.raw&&r.raw.vacancy_count)||'',dl=r.daysLeft;
 var desc=j.desc?E(j.desc):E(j.inst)+' is hiring a '+E(j.title)+'.';
 var rows=[['Role',r.role],['Department',r.dept||j.subj],['Qualification',j.qual&&j.qual!=='—'?j.qual:''],['Employment type',j.type],['Category',r.cat],['Work mode',r.mode]].filter(function(x){return x[1]});
 var sim=SP_JOBS.filter(function(x){return x.id!=j.id&&(x.inst===j.inst||x.cat===j.cat)}).slice(0,5);
 if(!sim.length)sim=SP_JOBS.filter(function(x){return x.id!=j.id}).slice(0,5);
 var simH=sim.length?sim.map(function(x){var q=x.raw||{};return'<a class="jd-sim" href="job-view.html?id='+encodeURIComponent(x.id)+'"><div><b>'+E(x.title)+'</b><small>'+JB_IC.bag+E(jbExpText({minExp:Number(x.exp)||0,raw:q.raw||{}}))+'</small><small>'+JB_IC.pin+E(x.loc||'India')+'</small><small style="color:var(--ink-faint)">'+jbPostedText(q.posted).replace('Posted ','Posted ')+'</small></div><div class="jd-sl">'+bjLogoHtml({logo:q.logo,name:x.inst,color:q.color,initials:q.initials},34)+'</div></a>'}).join(''):'<p class="jd-empty">No other openings right now.</p>';
 m.innerHTML='<div class="jd-page"><div class="jd-wrap"><p class="jd-crumb"><a href="jobs.html">← Back to all jobs</a></p><div class="jd-grid"><div class="jd-main">'+
  '<section class="jd-card"><div class="jd-top"><div style="min-width:0"><h1>'+E(j.title)+'</h1><div class="jd-org"><span>'+E(j.inst)+'</span><span class="jb-type '+pc+'">'+E(j.type)+'</span></div></div><div class="jd-logo">'+bjLogoHtml({logo:r.logo,name:j.inst,color:r.color,initials:r.initials},68)+'</div></div>'+
  '<div class="jd-facts"><div>'+JB_IC.bag+'<span>'+E(exp)+'</span><i class="sep"></i>'+JB_IC.rupee+'<span>'+E(j.sal||'Not disclosed')+'</span></div><div>'+JB_IC.pin+'<span>'+E(j.loc||'India')+'</span></div>'+(dl!=null&&dl!==undefined?'<div>'+JB_IC.cap+'<span>'+(dl<=0?'Closing today':'Apply within '+dl+' day'+(dl>1?'s':''))+'</span></div>':'')+'</div>'+
  '<div class="jd-stats"><span>'+E(jbPostedText(r.posted))+'</span>'+(vac?'<span>Openings: <b>'+E(vac)+'</b></span>':'')+'<span>Applicants: <b>'+(Number(r.applicants)||0)+'</b></span></div>'+
  '<div class="jd-cta"><button class="jb-btn pri" data-apply-job="'+sid+'" data-title="'+E(j.title)+'" '+(applied?'disabled':'')+' onclick="applyToJob(\''+sid+'\',this.dataset.title)">'+(applied?'Applied ✓':'Apply now')+'</button><button class="jb-btn save '+(saved?'on':'')+'" data-save-job="'+sid+'" onclick="jbToggleSave(\''+sid+'\',this,event)">'+JB_IC.mark+'<span class="t">'+(saved?'Saved':'Save')+'</span></button><button class="jb-btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);showGenericToast(\'Link copied\')">Share</button></div></section>'+
  '<section class="jd-card" id="jdDesc"><h2>Job description</h2><div class="jd-desc'+(String(j.desc||'').length>420?' clip':'')+'" id="jdDescTxt">'+desc+'</div>'+(String(j.desc||'').length>420?'<button class="jd-readmore" onclick="var d=document.getElementById(\'jdDescTxt\');var o=d.classList.toggle(\'open\');this.textContent=o?\'Read less\':\'Read more\'">Read more</button>':'')+'</section>'+
  (sk.length?'<section class="jd-card"><h2>Key skills</h2><div class="jd-chips">'+sk.map(function(x){return'<span class="jd-chip">'+E(x)+'</span>'}).join('')+'</div></section>':'')+
  (rows.length?'<section class="jd-card"><h2>Role details</h2><div class="jd-rows">'+rows.map(function(x){return'<div><small>'+x[0]+'</small>'+E(x[1])+'</div>'}).join('')+'</div></section>':'')+
  '<section class="jd-card"><h2>About '+E(j.inst)+'</h2><p class="jd-about">'+E(j.inst)+(j.loc?', '+E(j.loc):'')+'. Verified institution on Upaadhyay.</p></section>'+
  '</div><aside class="jd-side"><section class="jd-card"><h3>'+(sim.length&&sim[0].inst===j.inst?E(j.inst)+' roles you might like':'Similar jobs')+'</h3>'+simH+'</section></aside></div></div></div>'}
/* Ask Questions: shows the employer's answers and lets candidates send a question about this role. */
function qaGet(k,d){try{return JSON.parse(localStorage.getItem(k)||'')||d}catch(e){return d}}
function qaMount(jid){var host=document.getElementById('jdDesc')||document.querySelector('.sp-det .sp-card');if(!host)return;var cfg=qaGet('upaadhyay_jobqa_'+jid,{});if(cfg.on===false)return;
 var faq=(cfg.faq||'').split('\n').map(function(l){var p=l.split('|');return{q:(p[0]||'').trim(),a:p.slice(1).join('|').trim()}}).filter(function(x){return x.q});
 var box=document.createElement('div');box.id='qaBox';
 box.innerHTML='<h3>Ask questions about this role</h3>'+(cfg.contact?'<p>You can also email <a href="mailto:'+E(cfg.contact)+'">'+E(cfg.contact)+'</a>.</p>':'')+
  (faq.length?'<div id="qaFaq">'+faq.map(function(x){return'<p style="margin:10px 0 2px"><b>'+E(x.q)+'</b></p><p style="margin:0">'+(x.a?E(x.a):'<i>Answer coming soon.</i>')+'</p>'}).join('')+'</div>':'')+
  '<div id="qaList"></div><textarea id="qaText" rows="3" maxlength="500" placeholder="Type your question about this role (for example, teaching load or joining date)" style="width:100%;margin-top:12px;padding:10px;border:1px solid #cfd6e4;border-radius:8px;font:inherit"></textarea><div id="qaErr" style="color:#B42318;font-size:13px;min-height:18px"></div><button class="sp-btn" type="button" onclick="qaSend('+jid+')">Send question</button>';
 host.appendChild(box);qaDraw(jid)}
function qaDraw(jid){var l=document.getElementById('qaList');if(!l)return;var qs=qaGet('upaadhyay_jobqs_'+jid,[]);
 l.innerHTML=qs.length?'<p style="margin:14px 0 4px"><b>Your questions</b></p>'+qs.map(function(x){return'<p style="margin:6px 0">'+E(x.q)+' <small style="color:#6b7280">· '+E(x.d)+' · awaiting reply</small></p>'}).join(''):''}
function qaSend(jid){var t=document.getElementById('qaText'),e=document.getElementById('qaErr'),v=(t.value||'').trim();
 if(v.length<5){e.textContent='Please type your question (at least 5 characters).';return}e.textContent='';
 var qs=qaGet('upaadhyay_jobqs_'+jid,[]);qs.push({q:v,d:new Date().toLocaleDateString('en-IN')});
 try{localStorage.setItem('upaadhyay_jobqs_'+jid,JSON.stringify(qs))}catch(x){}t.value='';qaDraw(jid);
 if(window.showGenericToast)showGenericToast('Question sent')}
spLoadJobs().then(function(){if(!id)return list();spGetJob(id).then(function(j){if(j&&SP_JOBS.indexOf(j)<0)SP_JOBS.push(j);detail()})});</script></body></html>
