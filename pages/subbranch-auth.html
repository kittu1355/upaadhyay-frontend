<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-branch Account — Upaadhyay</title>
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/trendz-auth.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/auth-split.css">
<style>
/* sub-branch (same as faculty/employer login): single centred card, no side panel */
.auth-page{grid-template-columns:1fr !important;background:#f3f1f7 !important;overflow-y:auto}
.auth-page .auth-card{margin:20px auto !important;border-radius:5px !important;box-shadow:0 10px 40px rgba(75,31,158,.12) !important;padding:26px 26px !important;max-width:380px !important}
/* compact sizing */
.auth-card h2{font-size:24px !important;margin-bottom:4px !important;letter-spacing:-.5px}
.auth-card .sub{font-size:14px !important}
.auth-card .ap-page-tag{font-size:11px;padding:3px 10px;margin-bottom:8px !important}
.auth-card form{margin-top:10px !important}
.as-social{gap:10px;margin:12px 0 4px}
.as-social button{padding:9px;font-size:14px;gap:8px}
.as-social svg{width:18px;height:18px}
.as-or{font-size:12.5px;margin-top:10px}
.ap-step-label{font-size:13.5px !important;margin:12px 0 8px !important}
.auth-card .modal-tabs{gap:10px;margin-bottom:12px !important}
.auth-card .modal-tab{padding:9px;font-size:13.5px}
.auth-card .modal-field label{font-size:13.5px !important;margin-bottom:5px}
.auth-card .modal-field input,.auth-card .modal-field select{padding:10px 12px !important;font-size:14px !important}
.auth-step .btn.btn-primary,.auth-card button[type="submit"]{padding:11px !important;font-size:14.5px !important;margin-top:6px}
#authSwitchModeLink{font-size:13.5px}
.ac-switch-role{font-size:12.5px}
</style>
</head>
<body class="page page-auth">
<header class="as-head"><a class="as-brand" href="../index.html"><img src="../assets/logo/logo-mark.png" alt="Upaadhyay"><span class="as-word">Upaadh<span>yay</span></span></a><div class="as-switch" id="asSwitchWrap"></div></header>
<div class="auth-page" id="authOverlay">
  <div class="auth-card" id="authCard">
    <button class="ap-close" onclick="closeSub()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="ap-step-back" id="authStepBack" onclick="back()" style="display:none;" type="button" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    <span class="ap-page-tag">Sub-branch account</span>
    <h2 id="authTitle">Create your sub-branch account</h2>
    <p class="sub" id="authSub">Register free to continue</p>
    <form onsubmit="return submitAuth(event)" id="authForm">
      <div class="auth-step" id="authStep1">
          <div class="as-social"><button type="button" onclick="asSoon()"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 01-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.800-4.300H2.700v2.700A10 10 0 0012 22z"/><path fill="#FBBC05" d="M6.200 13.600a6 6 0 010-3.800V7.100H2.700a10 10 0 000 9.200z"/><path fill="#EA4335" d="M12 6c1.500 0 2.900.5 4 1.600l3-3A10 10 0 002.700 7.100l3.500 2.700C7 7.800 9.300 6 12 6z"/></svg>Google</button><button type="button" onclick="asSoon()"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="4" fill="#0a66c2"/><path fill="#fff" d="M6.400 9.500h2.500V18H6.400zM7.600 5.600a1.500 1.500 0 110 3 1.500 1.500 0 010-3zM10.400 9.500h2.400v1.200c.4-.7 1.300-1.400 2.600-1.400 2.600 0 3.100 1.700 3.100 3.900V18h-2.500v-4.300c0-1 0-2.300-1.400-2.300s-1.600 1.100-1.600 2.200V18h-2.500z"/></svg>LinkedIn</button></div>
          <div class="as-or">or continue with</div>
        <div class="ap-step-divider"></div>
        <p class="ap-step-label">How would you like to continue?</p>
        <div class="modal-tabs modal-tabs-icon"><button type="button" class="modal-tab active" id="methodEmail" onclick="setMethod('email')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6.5L12 13L21 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/></svg>
              <span>Email</span>
            </button><button type="button" class="modal-tab" id="methodPhone" onclick="setMethod('phone')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="2.5" width="10" height="19" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M11 18H13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span>Phone</span>
            </button></div>
        <button type="button" class="btn btn-primary" onclick="next()">Continue</button>
      </div>
      <div class="auth-step" id="authStep2" style="display:none;">
        <div id="emailF"><div class="modal-field"><label>Email</label><input type="email" id="em" placeholder="branch@college.edu"></div></div>
        <div id="phoneF" style="display:none;">
          <div class="modal-field"><label>Mobile number</label>
            <div style="display:flex;gap:8px;"><input type="tel" id="ph" placeholder="10-digit mobile number" maxlength="10" style="flex:1;"><button type="button" class="btn btn-light btn-sm" onclick="sendOtp()" style="white-space:nowrap;">Send OTP</button></div></div>
          <div class="modal-field" id="otpF" style="display:none;"><label>Enter OTP</label><input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" inputmode="numeric"><span style="font-size:12px;color:var(--ink-faint);">Demo mode — enter any 6-digit code.</span></div>
        </div>
        <p class="err" style="display:none;font-size:12.5px;color:#B3261E;margin:-6px 0 10px;"></p>
        <button type="button" class="btn btn-primary" onclick="next()">Continue</button>
      </div>
      <div class="auth-step" id="authStep3" style="display:none;">
        <div class="modal-field"><label>Sub-branch / College name</label><input type="text" id="bn" placeholder="e.g. St. Joseph College of Engineering"></div>
        <div class="modal-field"><label>Contact person</label><input type="text" id="cp" placeholder="Your name"></div>
        <p class="err" style="display:none;font-size:12.5px;color:#B3261E;margin:-6px 0 10px;"></p>
        <button type="button" class="btn btn-primary" onclick="next()">Continue</button>
      </div>
      <div class="auth-step" id="authStep4" style="display:none;">
        <div class="modal-field ap-pw-field"><label>Password</label><div class="ap-pw-wrap"><input type="password" id="pw" placeholder="••••••••"><button type="button" class="ap-pw-eye" onclick="togglePw('pw',this)" aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
              </button></div></div>
        <div class="modal-field ap-pw-field" id="pw2F"><label>Confirm password</label><div class="ap-pw-wrap"><input type="password" id="pw2" placeholder="••••••••"><button type="button" class="ap-pw-eye" onclick="togglePw('pw2',this)" aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
              </button></div></div>
        <p class="err" id="authError" style="display:none;font-size:12.5px;color:#B3261E;margin:-6px 0 10px;"></p>
        <button type="submit" class="btn btn-primary" id="authSubmitBtn">Create account</button>
      </div>
    </form>
    <p id="swMode" style="margin:14px 0 0;text-align:center;font-size:13.5px"></p>
    <p class="ac-switch-role">Not a sub-branch? <a href="institution-network.html?start=type">Switch account type</a></p>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/live-update.js?v=1"></script>
<script src="../js/store.js"></script>
<script>
var Q=new URLSearchParams(location.search),mode=Q.get('mode')==='login'?'login':'register',method='email',step=1;
function asSoon(){var t=document.createElement('div');t.textContent='Coming soon';t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1f1637;color:#fff;padding:11px 22px;border-radius:5px;font:600 14px Poppins,sans-serif;z-index:999';document.body.appendChild(t);setTimeout(function(){t.remove()},1800);}
function $(i){return document.getElementById(i)}
function order(){return mode==='register'?[1,2,3,4]:[1,2,4]}
function err(m){var e=document.querySelectorAll('.err');e.forEach(function(x){x.style.display='none'});if(m){var cur=document.querySelector('#authStep'+step+' .err')||$('authError');cur.textContent=m;cur.style.display='block'}}
function view(){
  document.querySelectorAll('.auth-step').forEach(function(e){e.style.display='none'});
  $('authStep'+step).style.display='block';
  $('authStepBack').style.display=step>1?'flex':'none';
  var r=mode==='register';
  $('authTitle').textContent=r?'Create your sub-branch account':'Sub-branch login';
  $('authSub').textContent=r?'Register free to continue':'Log in to your sub-branch dashboard';
  $('authSubmitBtn').textContent=r?'Create account':'Log in';
  $('pw2F').style.display=r?'block':'none';
  $('swMode').innerHTML=r?'<a href="#" onclick="setMode(\'login\');return false" style="font-size:13px;font-weight:600;">Already have an account? Log in</a>':'<a href="#" onclick="setMode(\'register\');return false" style="font-size:13px;font-weight:600;">New sub-branch? Create an account</a>';
  var sw=$('asSwitchWrap');
  sw.innerHTML=r?'Already registered? <a href="subbranch-auth.html?mode=login'+(BCODE?'&branch_code='+BCODE:'')+'" onclick="setMode(\'login\');return false">Log in</a> here':'New to Upaadhyay? <a href="subbranch-auth.html'+(BCODE?'?branch_code='+BCODE:'')+'" onclick="setMode(\'register\');return false">Register</a> here';
  err('');
}
const BCODE=(new URLSearchParams(location.search).get('branch_code')||'').replace(/\D/g,'').slice(0,5);
function closeSub(){location.href=(mode==='login'?'login.html':'register.html')+'?role=company'}
function setMode(m){mode=m;step=1;view()}
function setMethod(m){method=m;$('methodEmail').classList.toggle('active',m==='email');$('methodPhone').classList.toggle('active',m==='phone');$('emailF').style.display=m==='email'?'block':'none';$('phoneF').style.display=m==='phone'?'block':'none'}
function sendOtp(){if(!/^\d{10}$/.test($('ph').value.trim())){err('Enter a valid 10-digit mobile number.');return}err('');$('otpF').style.display='block'}
function next(){
  if(step===2){
    if(method==='phone'){err('Sub-branch accounts use email. Switch to Email.');return}
    if(method==='email'){if(!/.+@.+\..+/.test($('em').value.trim())){err('Enter a valid email address.');return}}
    else{if(!/^\d{10}$/.test($('ph').value.trim())){err('Enter a valid 10-digit mobile number.');return}if(!/^\d{6}$/.test($('otp').value.trim())){err('Send the OTP and enter the 6-digit code.');return}}
  }
  if(step===3&&(!$('bn').value.trim()||!$('cp').value.trim())){err('Enter the sub-branch name and contact person.');return}
  var o=order();step=o[o.indexOf(step)+1];view();
}
function back(){var o=order(),i=o.indexOf(step);if(i>0){step=o[i-1];view()}}
function togglePw(id,b){var i=$(id);i.type=i.type==='password'?'text':'password'}
function ls(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
async function syncBranch(u){
  /* rebuild the local dashboard state from the server (the server is the source of truth) */
  var m=null;try{m=await api.branches.mine()}catch(x){}
  if(!m||!m.connected||!m.status||m.status==='draft'){try{localStorage.removeItem('nwSub')}catch(x){}return 'code'}
  var st=m.approved?'approved':(m.status==='rejected'||m.admin_status==='rejected')?'rejected':'pending';
  var c=(u&&u.company)||{},mm=m.main||{};
  var main={id:mm.id,n:mm.name,c:[mm.city,mm.state].filter(Boolean).join(', '),t:mm.type||'Institution',code:mm.code,d:mm.description||'',web:mm.website||'',addr:mm.address||'',year:mm.year||'',logo:mm.logo||'',live:true};
  var sub={n:c.company_name||(u&&u.name)||'',c:[c.city,c.state].filter(Boolean).join(', '),em:(u&&u.email)||'',ph:(u&&u.phone)||'',by:(u&&u.name)||''};
  try{localStorage.setItem('nwSub',JSON.stringify({sub:sub,mainCode:main.code,mainName:main.n,main:main,st:st}))}catch(x){}
  return 'dash';
}
async function submitAuth(e){
  e.preventDefault();
  if(method!=='email'){err('Sub-branch accounts use email. Switch to Email.');return false}
  var id=$('em').value.trim().toLowerCase(),pw=$('pw').value,btn=$('authSubmitBtn');
  if(!/.+@.+\..+/.test(id)){err('Enter a valid email address.');return false}
  if(!pw){err('Enter your password.');return false}
  if(mode==='register'){
    if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){err('Password must be at least 8 characters and include letters and numbers.');return false}
    if(pw!==$('pw2').value){err('Passwords do not match.');return false}
  }
  btn.disabled=true;
  try{
    if(mode==='register'){
      var bn=$('bn').value.trim(),cp=$('cp').value.trim();
      /* REAL account on the backend (role company) - this gives the API token the join request needs */
      await api.register({name:cp,email:id,password:pw,password_confirmation:$('pw2').value,role:'company',company_name:bn});
      try{localStorage.setItem('nwSubAccount',JSON.stringify({id:id,branch:bn,contact:cp}));localStorage.removeItem('nwSub')}catch(x){}
      setBranchSession(id,bn);
      location.href='institution-network.html?start=code'+(BCODE?'&branch_code='+BCODE:'');
    }else{
      var u=await api.login(id,pw,'company');
      var nm=(u.company&&u.company.company_name)||u.name;
      try{localStorage.setItem('nwSubAccount',JSON.stringify({id:id,branch:nm,contact:u.name}))}catch(x){}
      setBranchSession(id,nm);
      var where=await syncBranch(u);
      location.href='institution-network.html?start='+where+(BCODE?'&branch_code='+BCODE:'');
    }
  }catch(x){err((x&&x.message)||'Something went wrong. Please try again.')}
  finally{btn.disabled=false}
  return false;
}
view();
</script>
</body>
</html>
